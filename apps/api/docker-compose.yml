# apps/api/docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omni-stellar-sidewalk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni-stellar-sidewalk_user
      POSTGRES_PASSWORD: omni-stellar-sidewalk_password
      POSTGRES_DB: omni-stellar-sidewalk_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - omni-stellar-sidewalk-network

  redis:
    image: redis:7-alpine
    container_name: omni-stellar-sidewalk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - omni-stellar-sidewalk-network

volumes:
  postgres_data:
    driver: local

networks:
  omni-stellar-sidewalk-network:
    driver: bridge