# apps/api/docker-compose.yml
#
#   docker compose up --build     # API on http://localhost:8000 (docs at /docs)
#
# The API container applies pending Alembic migrations before it starts serving.
services:
  postgres:
    image: postgres:16-alpine
    container_name: omni-stellar-sidewalk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni-stellar-sidewalk_user
      POSTGRES_PASSWORD: omni-stellar-sidewalk_password
      POSTGRES_DB: omni-stellar-sidewalk_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni-stellar-sidewalk_user -d omni-stellar-sidewalk_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - omni-stellar-sidewalk-network

  redis:
    image: redis:7-alpine
    container_name: omni-stellar-sidewalk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - omni-stellar-sidewalk-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-stellar-sidewalk_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://omni-stellar-sidewalk_user:omni-stellar-sidewalk_password@postgres:5432/omni-stellar-sidewalk_dev
      SECRET_KEY: ${SECRET_KEY:-default-dev-secret-key-change-in-production-min-32-chars}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    networks:
      - omni-stellar-sidewalk-network

volumes:
  postgres_data:
    driver: local

networks:
  omni-stellar-sidewalk-network:
    driver: bridge
